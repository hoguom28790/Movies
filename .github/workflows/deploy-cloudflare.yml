name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Toàn bộ biến môi trường (NEXT_PUBLIC_*, TOPXX_PASSWORD, ...) lưu trong 1 secret
      # nhiều dòng KEY=value. OpenNext nhúng .env.production vào Worker (dùng lúc build + runtime).
      - name: Write .env.production
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: printf '%s\n' "$ENV_PRODUCTION" > .env.production

      - run: npx opennextjs-cloudflare build

      - run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
